<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lane Detection — Algorithm Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101113; --panel:#0a0b0c; --line:rgba(255,255,255,.08);
    --txt:#eceef1; --dim:#8b9199;
    --accent:#ffb224; --accent-dim:rgba(255,178,36,.6);
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Space Grotesk','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%; background:var(--bg); color:var(--txt);
    font-family:var(--sans); font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(255,178,36,.25)}
  .stage{max-width:1280px;margin:0 auto;padding:0 24px 26px}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 2px 20px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{width:30px;height:30px;color:var(--accent);flex:none}
  h1{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .sub{font-size:12.5px;color:var(--dim);margin-top:4px;letter-spacing:.02em}
  .status{display:flex;align-items:center;gap:8px;padding-bottom:4px;white-space:nowrap;
    font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--dim)}
  .status .sep{color:#3f444a}
  #stTxt{color:var(--txt)}
  .dot{width:7px;height:7px;border-radius:50%;background:#4a4f55;flex:none}
  body.is-playing .dot{background:var(--accent);animation:pulse 1.6s ease-out infinite}
  body.is-ended  .dot{background:var(--accent)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,178,36,.4)}100%{box-shadow:0 0 0 7px rgba(255,178,36,0)}}

  /* ---------- feed grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
  .panel{
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    border:1px solid var(--line);background:var(--panel);cursor:zoom-in;
    user-select:none;-webkit-user-select:none;
    transition:border-color .25s,opacity .3s ease,transform .3s ease,box-shadow .3s;
    animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards;
  }
  .panel:nth-child(1){grid-area:1/1;animation-delay:.02s}
  .panel:nth-child(2){grid-area:1/2;animation-delay:.1s}
  .panel:nth-child(3){grid-area:2/1;animation-delay:.18s}
  .panel:nth-child(4){grid-area:2/2;animation-delay:.26s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .panel:hover{border-color:rgba(255,255,255,.22)}
  .grid.has-focus .panel.focused{
    grid-area:1/1/-1/-1;z-index:4;cursor:zoom-out;
    border-color:rgba(255,178,36,.4);
    box-shadow:0 24px 80px -20px rgba(0,0,0,.7);
  }
  .grid.has-focus .panel.focused:hover{border-color:rgba(255,178,36,.5)}
  .grid.has-focus .panel:not(.focused){opacity:0;transform:scale(.985);pointer-events:none}

  .strip{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;
    border-bottom:1px solid var(--line);flex:none}
  .num{font:500 10px var(--mono);letter-spacing:.08em;color:var(--accent-dim)}
  .name{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--txt)}
  .desc{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{margin-left:auto;font:500 9px var(--mono);letter-spacing:.2em;color:var(--dim)}
  .panel[data-tag="input"] .tag{color:var(--accent-dim)}

  .vwrap{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;flex:none}
  .panel.focused{min-height:0}
  .panel.focused .vwrap{aspect-ratio:auto;flex:1;min-height:0}
  video{display:block;width:100%;height:100%;object-fit:contain}

  /* corner ticks on hover / focus */
  .tick{position:absolute;width:13px;height:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
  .tick.tl{top:7px;left:7px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
  .tick.br{bottom:7px;right:7px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}
  .panel:hover .tick,.panel.focused .tick{opacity:.9}

  /* per-feed states */
  .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
    font:500 10px var(--mono);letter-spacing:.3em;color:var(--dim);transition:opacity .45s;z-index:2}
  .loader i{width:8px;height:13px;background:var(--accent);animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .panel.ready .loader{opacity:0;pointer-events:none}
  .spinner{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;
    border:2px solid rgba(255,255,255,.18);border-top-color:var(--accent);
    opacity:0;transition:opacity .18s;pointer-events:none;animation:spin .8s linear infinite;z-index:2}
  .panel.buffering .spinner{opacity:1;transition-delay:.25s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .offline{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;background:var(--panel);z-index:4}
  .panel.error .offline{display:flex}
  .panel.error .loader,.panel.error .spinner,.panel.error video{display:none}
  .off-t{font:500 11px var(--mono);letter-spacing:.28em;color:var(--txt)}
  .off-f{font:400 10.5px var(--mono);color:var(--dim)}

  /* ---------- transport bar ---------- */
  .controls{
    position:sticky;bottom:0;z-index:10;
    display:flex;align-items:center;gap:14px;
    margin:16px -24px 0;padding:13px 24px 15px;
    background:rgba(15,16,18,.86);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    user-select:none;-webkit-user-select:none;
  }
  .pbtn{width:46px;height:46px;flex:none;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);background:#17181b;color:var(--txt);
    display:grid;place-items:center;cursor:pointer;
    transition:border-color .2s,color .2s,transform .12s}
  .pbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pbtn:active{transform:scale(.94)}
  .pbtn svg{width:19px;height:19px}
  .pbtn .i-pause,.pbtn .i-replay{display:none}
  body.is-playing .pbtn .i-play{display:none}
  body.is-playing .pbtn .i-pause{display:block}
  body.is-ended .pbtn .i-play{display:none}
  body.is-ended .pbtn .i-replay{display:block}

  .tc{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);
    min-width:44px;text-align:center}
  .tc.cur{color:var(--txt)}

  .scrub{position:relative;flex:1;min-width:80px;height:26px;cursor:pointer;touch-action:none}
  .rail{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:rgba(255,255,255,.14)}
  .fill{height:100%;width:0;background:var(--accent)}
  .thumb{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
    background:var(--accent);transform:translate(-50%,-50%) scale(0);transition:transform .15s}
  .scrub:hover .thumb,.scrub.drag .thumb{transform:translate(-50%,-50%) scale(1)}
  .tip{position:absolute;bottom:calc(100% + 1px);left:0;transform:translateX(-50%);
    font:500 10px var(--mono);color:var(--txt);background:#1a1c1f;
    border:1px solid var(--line);padding:3px 7px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s}
  .scrub:hover .tip,.scrub.drag .tip{opacity:1}

  .grp{display:flex;gap:2px}
  .mbtn{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid transparent;
    background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;
    transition:color .2s,border-color .2s}
  .mbtn:hover{color:var(--txt);border-color:rgba(255,255,255,.14)}
  .mbtn svg{width:17px;height:17px}
  .mbtn .alt{display:none}
  .mbtn.active .main{display:none}
  .mbtn.active .alt{display:block}
  body.is-fs #fsBtn .main{display:none}
  body.is-fs #fsBtn .alt{display:block}

  .hints{margin-top:12px;text-align:center;font:400 10px var(--mono);
    letter-spacing:.1em;color:var(--dim);opacity:.8}
  .k{display:inline-block;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--txt);font-size:9.5px;font-weight:500;padding:2px 5px;border-radius:3px;margin:0 2px}

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
    .panel:not(.focused){grid-area:auto}
    header{flex-direction:column;align-items:flex-start;gap:10px}
    .desc{display:none}
    .controls{gap:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="stage">

  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M9.4 2.5 4.6 21.5"/>
        <path d="M14.6 2.5 19.4 21.5"/>
        <path d="M12 4.5v2.6M12 10.4v3.2M12 16.9v4.1"/>
      </svg>
      <div>
        <h1>Lane Detection System</h1>
        <p class="sub">Synchronized comparison — HSV · Hough · Adaptive, against raw source</p>
      </div>
    </div>
    <div class="status">
      <span class="dot"></span><span id="stTxt">STANDBY</span>
      <span class="sep">/</span><span>FEEDS&nbsp;04</span>
    </div>
  </header>

  <main class="grid" id="grid">
    <!-- To add another algorithm feed: copy a <figure class="panel"> block and change the video path -->
    <figure class="panel" data-tag="input">
      <figcaption class="strip">
        <span class="num">01</span><span class="name">Source</span>
        <span class="desc">raw camera input</span><span class="tag">INPUT</span>
      </figcaption>
      <div class="vwrap">
        <video src="data_compressed/VID_20261007_172854.mp4"
       muted playsinline preload="auto"></video>
        <div class="loader">ACQUIRING FEED<i></i></div>
        <div class="spinner"></div>
        <div class="offline"><span class="off-t">SIGNAL LOST</span><span class="off-f"></span></div>
        <b class="tick tl"></b><b class="tick br"></b>
      </div>
    </figure>

    <figure class="panel" data-tag="output">
      <figcaption class="strip">
        <span class="num">02</span><span class="name">HSV Mask</span>
        <span class="desc">hue / saturation color gating</span><span class="tag">OUTPUT</span>
      </figcaption>
      <div class="vwrap">
        <video src="data_compressed/hsv_result.mp4"
       muted playsinline preload="auto"></video>
        <div class="loader">ACQUIRING FEED<i></i></div>
        <div class="spinner"></div>
        <div class="offline"><span class="off-t">SIGNAL LOST</span><span class="off-f"></span></div>
        <b class="tick tl"></b><b class="tick br"></b>
      </div>
    </figure>

    <figure class="panel" data-tag="output">
      <figcaption class="strip">
        <span class="num">03</span><span class="name">Hough Lines</span>
        <span class="desc">probabilistic line transform</span><span class="tag">OUTPUT</span>
      </figcaption>
      <div class="vwrap">
        <video src="data_compressed/hough_result.mp4"
       muted playsinline preload="auto"></video>

        <div class="loader">ACQUIRING FEED<i></i></div>
        <div class="spinner"></div>
        <div class="offline"><span class="off-t">SIGNAL LOST</span><span class="off-f"></span></div>
        <b class="tick tl"></b><b class="tick br"></b>
      </div>
    </figure>

    <figure class="panel" data-tag="output">
      <figcaption class="strip">
        <span class="num">04</span><span class="name">Adaptive Thresh</span>
        <span class="desc">adaptive threshold segmentation</span><span class="tag">OUTPUT</span>
      </figcaption>
      <div class="vwrap">
        <video src="data_compressed/adaptive_result.mp4"
       muted playsinline preload="auto"></video>
        <div class="loader">ACQUIRING FEED<i></i></div>
        <div class="spinner"></div>
        <div class="offline"><span class="off-t">SIGNAL LOST</span><span class="off-f"></span></div>
        <b class="tick tl"></b><b class="tick br"></b>
      </div>
    </figure>
  </main>

  <div class="controls">
    <button class="pbtn" id="playBtn" aria-label="Play or pause all feeds" title="Play / Pause — Space">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8.4 5.8 18.2 12 8.4 18.2Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M8.7 6v12M15.3 6v12"/></svg>
      <svg class="i-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.6 4.4 1.6 10 7.2 10"/><path d="M4.1 14.9a9 9 0 1 0 2.1-9.3L1.6 10"/></svg>
    </button>
    <span class="tc cur" id="tcCur">00:00</span>
    <div class="scrub" id="scrub" role="slider" aria-label="Timeline — seek all feeds" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="rail"><div class="fill" id="fill"></div></div>
      <div class="thumb" id="thumb"></div>
      <div class="tip" id="tip">00:00</div>
    </div>
    <span class="tc" id="tcEnd">--:--</span>
    <div class="grp">
      <button class="mbtn" id="muteBtn" aria-label="Toggle source audio" title="Source audio">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <button class="mbtn" id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen — F">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>

  <p class="hints">
    <span class="k">SPACE</span> play / pause &nbsp;·&nbsp; <span class="k">←</span><span class="k">→</span> seek 5s
    &nbsp;·&nbsp; <span class="k">1–4</span> expand feed &nbsp;·&nbsp; <span class="k">ESC</span> back
    &nbsp;·&nbsp; <span class="k">F</span> fullscreen
  </p>
</div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const panels  = $$('.panel');
  const videos  = panels.map(p => p.querySelector('video'));
  const master  = videos[0];                 // the raw source drives everything
  const grid    = $('#grid');
  const playBtn = $('#playBtn');
  const tcCur   = $('#tcCur'), tcEnd = $('#tcEnd');
  const scrub   = $('#scrub'), fill = $('#fill'), thumb = $('#thumb'), tip = $('#tip');
  const muteBtn = $('#muteBtn'), fsBtn = $('#fsBtn');
  const stTxt   = $('#stTxt');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let duration = 0, scrubbing = false, ended = false;

  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const fmt = t => {
    if (!isFinite(t)) return '--:--';
    t = Math.max(0, t);
    return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(Math.floor(t%60)).padStart(2,'0');
  };

  /* ----- per-feed lifecycle: loading / buffering / offline ----- */
  panels.forEach((p, i) => {
    const v = videos[i];
    v.muted = true;
    const offFile = p.querySelector('.off-f');

    v.addEventListener('canplay',        () => { p.classList.add('ready'); p.classList.remove('buffering'); });
    v.addEventListener('playing',        () => p.classList.remove('buffering'));
    v.addEventListener('seeked',         () => p.classList.remove('buffering'));
    v.addEventListener('waiting',        () => p.classList.add('buffering'));
    v.addEventListener('seeking',        () => p.classList.add('buffering'));
    v.addEventListener('loadedmetadata', setDuration);
    v.addEventListener('ended',          refresh);
    v.addEventListener('error',          () => {
      offFile.textContent = v.getAttribute('src') || 'file not found';
      p.classList.add('error');
    });
    // safety net: if nothing arrives after 30s, flag the feed as offline
    const guard = setTimeout(() => {
      if (v.readyState < 3 && !p.classList.contains('error')) {
        offFile.textContent = v.getAttribute('src') || 'no signal';
        p.classList.add('error');
      }
    }, 30000);
    v.addEventListener('canplay', () => clearTimeout(guard), { once: true });
  });

  function setDuration(){
    const d = Math.max(0, ...videos.map(v => v.duration || 0));
    if (d && Math.abs(d - duration) > 0.01){ duration = d; tcEnd.textContent = fmt(d); }
  }

  /* ----- master transport: one button, all feeds ----- */
  const isPlaying = () => !master.paused && !master.ended;

  function refresh(){
    const allOver = videos.every(v => v.ended || (v.duration && v.currentTime >= v.duration - 0.05));
    ended = allOver && duration > 0;
    document.body.classList.toggle('is-playing', isPlaying());
    document.body.classList.toggle('is-ended', ended);
    stTxt.textContent = ended ? 'COMPLETE' : isPlaying() ? 'SYNCED' : 'STANDBY';
  }

  function playAll(){ videos.forEach(v => { if (!v.ended) v.play().catch(()=>{}); }); refresh(); }
  function pauseAll(){ videos.forEach(v => { v.pause(); v.playbackRate = 1; }); refresh(); }

  playBtn.addEventListener('click', () => {
    if (ended){ seekAll(0); playAll(); return; }
    isPlaying() ? pauseAll() : playAll();
  });
  master.addEventListener('play', refresh);
  master.addEventListener('pause', refresh);

  function seekAll(t){
    if (!duration) return;
    t = clamp(t, 0, duration);
    videos.forEach(v => {
      if (v.readyState >= 1){
        try { v.currentTime = Math.min(t, v.duration || t); } catch(e){}
      }
    });
    ended = false;
    updateProgress(t);
    refresh();
  }

  /* ----- drift correction: nudge speed, hard-resync if badly off ----- */
  setInterval(() => {
    if (scrubbing || !isPlaying() || master.readyState < 3) return;
    const ref = master.currentTime;
    for (let i = 1; i < videos.length; i++){
      const v = videos[i];
      if (v.paused || v.ended || v.readyState < 3) continue;
      const d = v.currentTime - ref;
      if (Math.abs(d) > 0.3){ try { v.currentTime = ref; } catch(e){} v.playbackRate = 1; }
      else if (Math.abs(d) > 0.04) v.playbackRate = clamp(1 - d * 0.4, 0.96, 1.04);
      else v.playbackRate = 1;
    }
  }, 800);

  /* ----- progress + custom scrubber ----- */
  function updateProgress(t){
    if (!duration) return;
    const p = clamp(t / duration * 100, 0, 100);
    fill.style.width = p + '%';
    thumb.style.left = p + '%';
    tcCur.textContent = fmt(t);
    scrub.setAttribute('aria-valuenow', Math.round(p));
  }
  (function loop(){ if (!scrubbing) updateProgress(master.currentTime); requestAnimationFrame(loop); })();

  const pctFrom = e => {
    const r = scrub.getBoundingClientRect();
    return clamp((e.clientX - r.left) / r.width, 0, 1);
  };
  scrub.addEventListener('pointerdown', e => {
    if (!duration) return;
    scrubbing = true;
    scrub.classList.add('drag');
    scrub.setPointerCapture(e.pointerId);
    seekAll(pctFrom(e) * duration);
    tipMove(e);
  });
  scrub.addEventListener('pointermove', e => {
    tipMove(e);
    if (scrubbing) seekAll(pctFrom(e) * duration);
  });
  const endDrag = () => { scrubbing = false; scrub.classList.remove('drag'); };
  scrub.addEventListener('pointerup', endDrag);
  scrub.addEventListener('pointercancel', endDrag);

  function tipMove(e){
    if (!duration) return;
    const p = pctFrom(e);
    tip.style.left = p * 100 + '%';
    tip.textContent = fmt(p * duration);
    tip.style.transform = p < 0.07 ? 'translateX(0)' : p > 0.93 ? 'translateX(-100%)' : 'translateX(-50%)';
  }

  /* ----- audio (source only) & fullscreen ----- */
  muteBtn.addEventListener('click', () => {
    master.muted = !master.muted;
    muteBtn.classList.toggle('active', !master.muted);
    muteBtn.setAttribute('aria-label', master.muted ? 'Unmute source audio' : 'Mute source audio');
  });

  function toggleFS(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
  fsBtn.addEventListener('click', toggleFS);
  document.addEventListener('fullscreenchange', () =>
    document.body.classList.toggle('is-fs', !!document.fullscreenElement));

  /* ----- expand one feed to full stage (others keep playing) ----- */
  function flip(el, mutate){
    if (reduced){ mutate(); return; }
    const first = el.getBoundingClientRect();
    mutate();
    const last = el.getBoundingClientRect();
    const dx = first.left - last.left, dy = first.top - last.top;
    const sx = first.width / last.width, sy = first.height / last.height;
    el.style.zIndex = 7;
    const a = el.animate(
      [{ transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, transformOrigin: 'top left' },
       { transform: 'none', transformOrigin: 'top left' }],
      { duration: 460, easing: 'cubic-bezier(.24,.8,.22,1)' });
    const done = () => { el.style.zIndex = ''; };
    a.onfinish = done; a.oncancel = done;
  }

  function toggleFocus(p){
    const now = performance.now();
    if (now - (p._lk || 0) < 480) return;   // ignore clicks mid-animation
    p._lk = now;
    const willFocus = !p.classList.contains('focused');
    flip(p, () => {
      grid.classList.toggle('has-focus', willFocus);
      p.classList.toggle('focused', willFocus);
    });
  }
  panels.forEach(p => p.addEventListener('click', () => toggleFocus(p)));

  /* ----- keyboard ----- */
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea')) return;
    const focused = grid.querySelector('.panel.focused');
    switch (e.key){
      case ' ':          e.preventDefault(); playBtn.click(); break;
      case 'ArrowRight': e.preventDefault(); seekAll(master.currentTime + 5); break;
      case 'ArrowLeft':  e.preventDefault(); seekAll(master.currentTime - 5); break;
      case 'f': case 'F': toggleFS(); break;
      case 'Escape':     if (focused) toggleFocus(focused); break;
      case '1': case '2': case '3': case '4': {
        const p = panels[+e.key - 1];
        if (!p) break;
        if (focused && focused !== p) toggleFocus(focused);
        toggleFocus(p);
        break;
      }
    }
  });

  refresh();
})();
</script>
</body>
</html>
